name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Dhpke.slnx

      - name: Test (F#)
        run: dotnet test tests/Hpke.Tests/Hpke.Tests.fsproj --no-restore --nologo

      - name: Test (C#)
        run: dotnet test tests/Hpke.CSharp.Tests/Hpke.CSharp.Tests.csproj --no-restore --nologo
